# 테스트 전용 설정. classpath:/config/는 메인 application.yaml을 가리지 않고 그 위에 덧씌워진다.
# 실제 값은 환경 변수로 넣는다. 여기 값을 배포에 쓰지 않는다.
jwt:
  secret: test-only-jwt-secret-not-for-production-0123456789
# 테스트 컨텍스트 캐시 통계 (새로 띄운 수 missCount, 재사용 수 hitCount).
# 테스트가 느려졌을 때 컨텍스트가 몇 개 뜨는지 확인하는 용도. 테스트 리포트의 표준 출력에만 남는다
logging:
  level:
    org.springframework.test.context.cache: DEBUG