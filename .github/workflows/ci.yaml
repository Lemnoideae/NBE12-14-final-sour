name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ dev ]
  workflow_call:  # 나중에 CD 워크플로에서 호출하기 위한 자리

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트
        id: unit-test
        run: ./gradlew test

      - name: 통합 테스트
        if: success() || steps.unit-test.outcome == 'failure'
        run: ./gradlew integrationTest

      - name: 테스트 요약
        if: always()
        run: |
          summarize() {
            local name=$1 dir=$2
            if ! ls "$dir"/*.xml >/dev/null 2>&1; then
              echo "| $name | 실행 안 됨 | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
              return
            fi
            local tests=0 failures=0 skipped=0
            for f in "$dir"/*.xml; do
              head=$(grep -ao '<testsuite [^>]*' "$f" | head -1)
              t=$(echo "$head"  | grep -o 'tests="[0-9]*"'    | grep -o '[0-9]*')
              fl=$(echo "$head" | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*')
              er=$(echo "$head" | grep -o 'errors="[0-9]*"'   | grep -o '[0-9]*')
              sk=$(echo "$head" | grep -o 'skipped="[0-9]*"'  | grep -o '[0-9]*')
              tests=$((tests + t)); failures=$((failures + fl + er)); skipped=$((skipped + sk))
            done
            # 컨텍스트 캐시 통계는 실행 순서대로 누적되므로 missCount가 가장 큰 줄이 최종값
            stats=$(grep -aho 'hitCount = [0-9]*, missCount = [0-9]*' "$dir"/*.xml | sort -t= -k3 -n | tail -1)
            hit=$(echo "$stats"  | grep -o 'hitCount = [0-9]*'  | grep -o '[0-9]*')
            miss=$(echo "$stats" | grep -o 'missCount = [0-9]*' | grep -o '[0-9]*')
            echo "| $name | $tests | $failures | $skipped | ${miss:--} (재사용 ${hit:--}) |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "## 🧪 테스트 요약"
            echo ""
            echo "| 구분 | 테스트 | 실패 | 건너뜀 | 컨텍스트 생성 |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          summarize "단위" build/test-results/test
          summarize "통합" build/test-results/integrationTest

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/
            build/test-results/
