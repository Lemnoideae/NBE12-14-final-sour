id: no-generic-exception-in-domain
language: java
severity: error
message: 도메인 코드에서는 $EX 대신 BusinessException(ErrorCode.XXX)을 던지세요.
note: |
  일반 예외는 GlobalExceptionHandler에서 500 COMMON_INTERNAL_ERROR가 되어 클라이언트가 원인을 알 수 없습니다.
  1. ErrorCode의 자기 도메인 구역에 코드를 추가합니다. 예: USER_NOT_FOUND(HttpStatus.NOT_FOUND, "USER_NOT_FOUND", "사용자를 찾을 수 없습니다.")
  2. throw new BusinessException(ErrorCode.USER_NOT_FOUND);
     또는 .orElseThrow(() -> new BusinessException(ErrorCode.USER_NOT_FOUND));
files:
  - src/main/java/**/domain/**/*.java
rule:
  pattern: new $EX($$$)
constraints:
  EX:
    regex: ^(java\.lang\.)?(RuntimeException|IllegalArgumentException|IllegalStateException)$
