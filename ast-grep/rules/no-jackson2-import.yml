id: no-jackson2-import
language: java
severity: error
message: Jackson 2 패키지(com.fasterxml.jackson.databind / core)를 쓰지 마세요. 이 프로젝트는 Jackson 3(tools.jackson)입니다.
note: |
  - ObjectMapper 대신 주입받은 tools.jackson.databind.json.JsonMapper를 쓰세요.
  - Jackson 3의 databind·core 패키지는 tools.jackson.databind, tools.jackson.core입니다.
  - 어노테이션(com.fasterxml.jackson.annotation.*)은 Jackson 3에서도 같은 패키지라 그대로 씁니다.
rule:
  kind: import_declaration
  regex: com\.fasterxml\.jackson\.(databind|core)\b
